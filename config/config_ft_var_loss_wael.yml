training_config:
  num_mini_epochs: 80          # 64 done in vbm9r3om -> ~16 fine-tune epochs
  learning_rate_scheduling:
    lr_max: 7.1e-6             # -> effective constant LR 2.0e-5 at world_size 8 (sqrt policy)
  losses:
    # merged with (not replacing) the inherited 'physical' MSE block
    structure:
      type: LossStructureFunction
      weight: 0.05             # arm B: 0.1 via --options (SF~4 x 0.05 = 0.2 vs mse total ~0.15)
      target_and_aux_calc: Physical
      loss_fcts:
        struct:
          target_stream: CERRA
          channels: ['tp', '10si']   # the two high-frequency channels; 2t stays MSE-only
          num_pairs: 262144
          bin_edges_km: [10, 25, 50, 100, 200]
          increment_power: 2.0
          reduce: mean

# Merges into the streams dict inherited from the saved run config (no streams_directory here
# on purpose — setting one would WIPE the inherited streams, config.py:441).
streams:
  CERRA:
    # order = train_target_channels = ['10si', '10wdir', '2t', 'tp'] -> zero out 10wdir
    target_channel_weights: [1.0, 0.0, 1.0, 1.0]

wgtags:
  org: null
  issue: null
  exp: cerra_ft_structure
  grid: null
