global_plotting_options:
 regions: ["arome"]
 image_format : "png" 
 dpi_val : 500
 fps: 2

evaluation:
  metrics  : ["rmse"]
  regions: ["arome"]
  summary_plots : true
  ratio_plots : true
  heat_maps : false
  summary_dir: "./plots/MF/eval_plots/Titan_experiments/atmofs03_ft"
  plot_ensemble: false #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: true
  num_processes: "auto"  #options: int, "auto", 0 means no parallelism (default)
  
default_streams:
  TITAN:
    channels: [ '2t', 'msl', 'q_850', 't_850', 'u_850', 'v_850', 'z_850']
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    plotting:
      sample: [1,2,3]
      forecast_step: "all"
      ensemble: "mean"
      plot_maps: true
      plot_bias: true
      plot_target: true
      plot_histograms: true
      plot_animations: true
      
run_ids :
      
      hra1kbl5:
          label: "Tital ft - target all variables"
          color: "tab:blue"
          rank: "all"
      
      qhfy5sdz:
          label: "Tital ft - target 7 variables"
          color: "tab:green"
          rank: "all"
