# max_workers: 36  # hard cap on parallel workers (I/O, plotting, scoring)

evaluation:
  metrics  : ["rmse", "froct"]
  regions: ["europe"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation
  plot_score_animations: false #plot animations of score maps across forecast steps. it slows down score computation
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false
  # baseline: "ar40mckx"


global_plotting_options:
  regions: ["europe"]
  CERRA:
    use_datashader: true
  ERA5:
    use_datashader: true



default_streams:
  ERA5:
    channels: ["2t", "q_850", "10v", "10u", "z_500", "t_850", "u_850", "v_850"]
    evaluation:
      forecast_step: 1-9
      sample: "all"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: [0]
      forecast_step: 1-9 #supported: "all", [1,2,3,...], "1-50" (equivalent of [1,2,3,...50])
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      plot_maps: true
      plot_target: true
      plot_histograms: false
      plot_animations: true
  CERRA:
    channels: ["2t", "r_850", "10si", "10wdir", "z_500", "t_850", "u_850", "v_850", "2r", "msl"]
    evaluation:
      forecast_step: 1-9
      sample: "all"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: [0]
      forecast_step: 1-9
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      plot_maps: true
      plot_target: true
      plot_histograms: false
      plot_animations: true
      plot_subtimesteps: true

run_ids :
  f88yha0q:
    label: "ERA5 + CERRA (Matteo)"
    type: json
    results_base_dir: "./results/f88yha0q"
    streams:
      CERRA:
        channels: ["10si", "10wdir", "2r", "2t", "msl", "r_1000", "r_850", "t_850", "u_850", "v_850", "z_500"]
        evaluation:
          forecast_step: "all"
          sample: "all"
          ensemble: "all"

  mu6z4ei1:
    label: "ERA5 + CERRA (CERRA Healpix=7, ERA5 Healpix=5, 32 epochs)"
    results_base_dir: "./results/mu6z4ei1"

  cxzeknw9:
    label: "ERA5 + CERRA (CERRA Healpix=7, ERA5 Healpix=5, 64 epochs)"
    results_base_dir: "./results/cxzeknw9"

