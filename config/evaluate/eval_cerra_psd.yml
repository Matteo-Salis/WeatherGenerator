global_plotting_options:
 regions: ["cerra"]
 image_format : "png" 
 dpi_val : 500
 fps: 2

evaluation:
  regions: ["cerra"]
  metrics  : 
    - psd:
        psd_method: "fft"                    # "sht" (SHT-based) or "fft" (regrid FFT)
        psd_regrid_resolution: 0.25           # degrees, only for fft method
        # grid_type: "octahedral"              # "octahedral" (default), "regular", "reduced".
  summary_plots : true
  ratio_plots : true
  summary_dir: "./plots/MF_KNMI/eval_plots/CERRA_experiments/structure_loss"

default_streams:
  CERRA:
    channels: ['10si', '10wdir', '2t'] #, "blah"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "mean"
    plotting:
      sample: [0,15] #,1,2,3,4,5,6,7]
      forecast_step: "all"
      ensemble: "mean"
      plot_maps: true
      plot_bias: true
      plot_target: true
      plot_histograms: true
      plot_animations: true

run_ids :

  lca7rnty:
    #type: "json"
    label: "Wael-Pretraining"
    rank: "all"
    color: "tab:blue"
