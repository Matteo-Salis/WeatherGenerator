ERA5 :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 0
  target : ['2t', 'msl', '10u', '10v', 'q_850', 't_850', 'u_850', 'v_850', 'z_850']
  source : ['2t', 'msl', '10u', '10v', 'q_850', 't_850', 'u_850', 'v_850', 'z_850']
  loss_weight : 1
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: -1
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
  # # Per-channel weights carried over from the full-state pressure-level scaling convention
  # # used elsewhere in the repo (weight increases toward the surface); msl/2d default to 1.0.
  # channel_weights :
  #   q_700: 0.61
  #   q_850: 0.71
  #   t_850: 0.71
  #   u_850: 0.71
  #   v_850: 0.71
  #   z_500: 0.48
